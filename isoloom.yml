# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# pythia (Google's 2021 security competition, by Google; a crypto challenge) as an Isoloom spec:
# an AES-GCM decryption oracle with keys derived from three-letter passwords and a tight query budget.
# The challenge folder 2021/quals/crypto-pythia of Google's challenge archive is vendored unchanged in app/ and built by its own Dockerfile.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: google-ctf-2021-pythia

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs: [CTF_FLAG_MAIN]

networks:
  lab: { cidr: 10.60.181.0/24, internet: false }

machines:
  challenge:
    networks: { lab: 10 }
    services: [{ port: 1337, name: challenge, publish: 1337 }]
    resources: { cpus: 1, memory_mb: 512 }
    privileged: true  # the image's setup script mounts /proc and nsjail creates namespaces
    inputs: [CTF_FLAG_MAIN]
    volumes: { ctf: /chroot }   # the flag, written by ctf/flag.sh at every start
    docker:
      build: app/challenge
      init: [ctf/flag.sh]

checks:
  - name: the challenge service answers
    tcp: challenge:1337
    wait: 120
  - name: the oracle shows its menu
    script: checks/probe.sh
    wait: 60

message: |
  pythia (Google, 2021) answers at `nc localhost {{ machines.challenge.services.0.publish }}`.
  One query tests one password, unless a single ciphertext can be valid under many keys at once.
